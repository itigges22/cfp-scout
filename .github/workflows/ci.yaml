name: ci

# Runs on every push and PR. Pass-1 jobs: api lint + unit tests +
# typecheck, and frontend tsc + build. Image build, integration tests
# (testcontainers), and Playwright e2e land in plan 28 pass 2.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-lint-and-tests:
    name: api · lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          # We don't commit uv.lock yet, so the default cache glob
          # (**/uv.lock) fails. Point at pyproject.toml so the cache
          # keys off its hash and the step doesn't error out.
          enable-cache: true
          cache-dependency-glob: "apps/api/pyproject.toml"

      - name: Install api deps (dev included)
        run: uv sync --no-progress

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy (strict)
        # mypy strict is configured in pyproject.toml.
        # Continue-on-error for now while we work down the type debt;
        # flip to required in plan 28 pass 2 once it's clean.
        continue-on-error: true
        run: uv run mypy app

      - name: pytest (unit only)
        run: uv run pytest tests/unit -q

  web-typecheck-and-build:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
          run_install: false

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: TypeScript check + Vite build
        # `pnpm build` runs `tsr generate && tsc -b && vite build`.
        run: pnpm build

      - name: ESLint
        run: pnpm lint
