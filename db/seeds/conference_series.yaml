    typical_month: 6
    typical_topics: [LLM, AI engineering, RAG, agents, applied AI]
    homepage: https://ai.engineer
  - canonical_name: MLOps World
    aliases: []
    description: Operationalizing ML in production.
    typical_topics: [MLOps, model deployment, monitoring, data pipelines]
    homepage: https://mlopsworld.com
  - canonical_name: Hugging Face Events
    aliases: [HF Events]
    description: Hugging Face hosted/co-hosted gatherings.
    typical_topics: [LLM, open models, transformers, fine-tuning]
    homepage: https://huggingface.co/events
  - canonical_name: Ray Summit
    aliases: []
    description: Distributed ML + Ray ecosystem.
    typical_topics: [distributed ML, scaling, Ray, LLM serving]
    homepage: https://raysummit.org
  - canonical_name: MLSys
    aliases: [Conference on Machine Learning and Systems]
    description: Systems for ML + ML for systems.
    typical_month: 5
    typical_topics: [systems for ML, distributed training, inference]
    homepage: https://mlsys.org

  # ---- <vendor> / vendor adjacency ----
  - canonical_name: Vendor Summit
    aliases: [RHSummit]
