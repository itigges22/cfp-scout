    typical_topics: [software architecture, distributed systems, engineering leadership]
    homepage: https://qconferences.com
  - canonical_name: Strange Loop
    aliases: []
    description: "Polyglot programming + systems thinking (note: paused; kept for past attendance)."
    typical_month: 9
    typical_topics: [programming languages, distributed systems, computing]
    homepage: https://thestrangeloop.com
