  - canonical_name: re:Invent
    aliases: [AWS reInvent, AWS re-Invent]
    description: AWS flagship developer + infrastructure event.
    typical_month: 12
    typical_topics: [aws, cloud, infrastructure, generative AI]
    homepage: https://reinvent.awsevents.com
  - canonical_name: Google Cloud Next
    aliases: [Google Next, Cloud Next]
    description: Google Cloud's flagship event.
    typical_month: 4
