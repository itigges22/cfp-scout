# Scout — Alembic configuration.
#
# Run from inside the api container (where the venv is active):
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"
#
# Or from the host via the Makefile:
#   make migrate
#   make migrate-create MSG="describe the change"
#
# The actual DSN is built in alembic/env.py from POSTGRES_* env vars at
# runtime — never hard-coded here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Use a date prefix on revision filenames to make ordering obvious
# without relying on alphabetic mash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# Truncate the slug at 18 chars. Combined with the 14-char date prefix
# (YYYYMMDD_HHMM_) this keeps the total revision ID under Alembic's
# default alembic_version varchar(32) limit.
truncate_slug_length = 18

# We never need Alembic to talk to a sqlalchemy URL set here — env.py
# constructs it from POSTGRES_* at runtime.
# sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging — Alembic uses stdlib logging, not structlog. Keep it minimal;
# real logs come through the api's structlog config in main.py.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
