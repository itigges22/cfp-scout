# apps/api/pyproject.toml — stub. Filled in step 06.
[project]
name = "scout-api"
version = "0.1.0"
description = "Scout FastAPI service (also serves the built SPA and runs APScheduler)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Red Hat DAAM" }]

# Plan 02 ships the minimum for the api container to start and serve /healthz +
# the placeholder SPA. Step 06 adds SQLAlchemy / Alembic / Pydantic settings /
# structlog. Step 13 adds APScheduler. Step 10 adds the openai client.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pycountry>=24.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "pgvector>=0.3",
    "openai>=1.55",
    "tenacity>=9.0",
    "httpx>=0.28",
    "docling>=2.10",
    # torch + torchvision pinned here so [tool.uv.sources] below can route
    # them to the CPU-only PyTorch wheel index (~3GB smaller than the default
    # GPU wheels, which bundle CUDA libs we'd never use on this stack).
    "torch>=2.5",
    "torchvision>=0.27.0",
    # APScheduler runs in-process inside the api container (plan 13). The
    # SQLAlchemyJobStore persists schedules in Postgres so jobs survive
    # `make down/up`. psycopg (v3) is the sync driver for the jobstore — the
    # rest of the app rides asyncpg, but APScheduler 3.x is sync-only.
    "apscheduler[sqlalchemy]>=3.10",
    "psycopg[binary]>=3.2",
    # Scraper (plan 14): no Playwright. We do HTTP-only fetching via httpx
    # (already in deps), feed parsing via feedparser, HTML parsing via
    # selectolax (very fast lexbor-based parser, much smaller than lxml).
    # Crawl4AI was considered but its dep tree + Playwright optional path are
    # both heavier than we need for static-only crawling.
    "feedparser>=6.0",
    "selectolax>=0.3",
    # PyYAML is used by the plan-23 series seed migration (db/seeds/
    # conference_series.yaml). Tiny dep, widely-used + battle-tested.
    "pyyaml>=6.0",
    # Extraction (plan 15): trafilatura strips boilerplate from scraped HTML
    # before the LLM sees the page; python-slugify generates conferences.slug.
    "trafilatura>=1.12",
    "python-slugify>=8.0",
    # Knowledge graph (plan 16). NetworkX is pure-Python, ~3MB; we don't
    # need igraph or graph-tool for Phase 1 scale (low thousands of nodes).
    "networkx>=3.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "S",   # flake8-bandit
    "TCH", # flake8-type-checking
]
ignore = [
    "S101",  # use of assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
