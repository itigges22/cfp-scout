apiVersion: v1
kind: Service
metadata:
  name: {{ include "scout.fullname" . }}-api
  labels:
    {{- include "scout.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
