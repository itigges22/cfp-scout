{{- /*
Alembic migrations Job. Wired as a Helm pre-install / pre-upgrade
hook so it runs BEFORE the API + scheduler Deployments roll out.
If the migration fails, the install/upgrade fails — the API never
serves traffic against a stale schema.

Uses the same image as the API; just overrides the entrypoint.

Hook delete policy: successful jobs get cleaned up automatically so
the namespace doesn't accumulate "Completed" Job objects. Failed
jobs persist so you can `oc logs` them.
*/}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scout.fullname" . }}-migrations
  labels:
    {{- include "scout.componentLabels" (dict "ctx" . "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.migrations.hookDeletePolicy }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600  # auto-cleanup 10min after completion
  template:
    metadata:
      labels:
        {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "scout.serviceAccountName" . }}
      {{- include "scout.imagePullSecrets" . | nindent 6 }}
      {{- include "scout.podSecurityContext" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2
              done
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ include "scout.fullname" . }}-config
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        - name: migrate
          image: {{ include "scout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          # Run alembic with the same env the API uses so it reads the
          # right DB url + credentials.
          command:
            - alembic
            - upgrade
            - head
          {{- include "scout.commonEnvFrom" . | nindent 10 }}
          env:
            {{- include "scout.commonSecretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
