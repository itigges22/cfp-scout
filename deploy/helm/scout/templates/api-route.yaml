{{- /*
OpenShift Route for the API. ``edge`` termination is the simplest
TLS option — the Route certificates terminate at the OpenShift router
and forward plain HTTP to the pod. Switch to ``reencrypt`` if you
deploy a per-pod TLS cert (rare for internal-tool installs).

If route.host is left blank, OpenShift auto-generates a host like
``<release>-api-<namespace>.<wildcard-domain>``.
*/}}
{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "scout.fullname" . }}
  labels:
    {{- include "scout.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    # Document uploads run Docling + an LLM call in-request; the router's
    # default 30s cuts them off mid-parse and serves its HTML timeout
    # page. Value is operator-tunable via route.timeout.
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout | default "300s" | quote }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "scout.fullname" . }}-api
    weight: 100
  port:
    targetPort: {{ if .Values.oauth.enabled }}oauth{{ else }}http{{ end }}
  {{- if .Values.route.tls.enabled }}
  tls:
    termination: {{ if .Values.oauth.enabled }}reencrypt{{ else }}{{ .Values.route.tls.termination }}{{ end }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  {{- end }}
  wildcardPolicy: None
{{- end }}
