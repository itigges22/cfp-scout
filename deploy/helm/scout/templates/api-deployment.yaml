{{- /*
Scout API Deployment. Runs FastAPI + the bundled SPA. With default
values the in-process scheduler is DISABLED (SCHEDULER_MODE=disabled);
the standalone scout-scheduler Deployment owns scheduling. Set
api.schedulerMode=embedded only for single-replica installs without a
standalone scheduler.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scout.fullname" . }}-api
  labels:
    {{- include "scout.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 0 means we never go below desired-replica count
      # during a rolling update — for a 2-replica baseline, that means
      # zero-downtime rolls. maxSurge 1 lets us add one new pod at a
      # time so we don't double-provision CPU/mem.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        # Roll the Deployment whenever the ConfigMap content changes —
        # otherwise updating values.yaml + helm upgrade wouldn't restart
        # pods that already booted with the old env.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "scout.serviceAccountName" . }}
      {{- include "scout.imagePullSecrets" . | nindent 6 }}
      {{- include "scout.podSecurityContext" . | nindent 6 }}
      {{- if .Values.api.podAntiAffinityPreferred }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Two init containers run before the API serves traffic:
      #   1. wait-for-postgres: blocks until pg_isready succeeds. Cheap.
      #   2. migrate: runs ``alembic upgrade head`` against the DB.
      #      Idempotent — alembic uses Postgres advisory locks so
      #      multiple replicas booting simultaneously serialize their
      #      migration check; whichever replica wins the lock applies
      #      pending migrations, the others see the schema current and
      #      exit clean. This is the modern Helm pattern (each pod
      #      ensures its own schema) — simpler than a separate
      #      pre-install Hook Job because there's no hook-ordering
      #      brittleness with ConfigMap / ServiceAccount / Secrets.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres at $POSTGRES_HOST:$POSTGRES_PORT..."
                sleep 2
              done
              echo "postgres ready"
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ include "scout.fullname" . }}-config
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        - name: migrate
          image: {{ include "scout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          command: ["alembic", "upgrade", "head"]
          {{- include "scout.commonEnvFrom" . | nindent 10 }}
          env:
            {{- include "scout.commonSecretEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      containers:
        - name: api
          image: {{ include "scout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          # Default container entrypoint from the Containerfile already
          # starts uvicorn on port 8000. The chart doesn't override
          # ``command:`` here so any tag-level entrypoint change keeps
          # working. If you need to start uvicorn with different flags,
          # override at the image tag, not in the chart.
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "scout.commonEnvFrom" . | nindent 10 }}
          env:
            - name: SCHEDULER_MODE
              value: {{ .Values.api.schedulerMode | quote }}
            {{- include "scout.commonSecretEnv" . | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: shared-storage
              mountPath: /var/lib/scout/storage
        {{- if .Values.oauth.enabled }}
        - name: oauth-proxy
          image: {{ .Values.oauth.image | default "quay.io/openshift/origin-oauth-proxy:4.15" }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: oauth
              containerPort: 8443
              protocol: TCP
          args:
            - --provider=openshift
            - --pass-basic-auth=false
            - --https-address=:8443
            - --http-address=
            - --email-domain={{ .Values.oauth.emailDomain | default "redhat.com" }}
            - --upstream=http://localhost:8000
            # Document uploads legitimately take ~1 minute (Docling parse +
            # LLM extraction). The proxy's default 30s upstream timeout
            # 502'd responses the API went on to complete successfully —
            # the LAST of three stacked lids (route timeout, memory limit,
            # this) that all had to rise for uploads to survive.
            - --upstream-timeout={{ .Values.oauth.upstreamTimeout | default "300s" }}
            - --openshift-service-account={{ include "scout.serviceAccountName" . }}
            - --tls-key=/etc/tls/private/tls.key
            - --tls-cert=/etc/tls/private/tls.crt
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --openshift-ca=/etc/pki/tls/cert.pem
            - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --openshift-ca=/etc/ocp-injected-certs/service-ca.crt
            - --set-xauthrequest
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-session
              mountPath: /etc/proxy/secrets
              readOnly: true
            - name: ocp-injected-certs
              mountPath: /etc/ocp-injected-certs
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- end }}
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{ include "scout.fullname" . }}-storage
        {{- if .Values.oauth.enabled }}
        - name: proxy-tls
          secret:
            secretName: {{ .Values.oauth.tlsSecretName | default "scout-api-tls" }}
        - name: proxy-session
          secret:
            secretName: {{ .Values.oauth.sessionSecretName | default "scout-proxy-session" }}
        - name: ocp-injected-certs
          configMap:
            name: {{ include "scout.fullname" . }}-ocp-injected-certs
        {{- end }}
