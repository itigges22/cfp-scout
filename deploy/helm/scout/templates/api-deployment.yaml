{{- /*
Scout API Deployment. Runs FastAPI + the bundled SPA. With default
values the in-process scheduler is DISABLED (SCHEDULER_MODE=disabled);
the standalone scout-scheduler Deployment owns scheduling. Set
api.schedulerMode=embedded only for single-replica installs without a
standalone scheduler.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scout.fullname" . }}-api
  labels:
    {{- include "scout.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 0 means we never go below desired-replica count
      # during a rolling update — for a 2-replica baseline, that means
      # zero-downtime rolls. maxSurge 1 lets us add one new pod at a
      # time so we don't double-provision CPU/mem.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        # Roll the Deployment whenever the ConfigMap content changes —
        # otherwise updating values.yaml + helm upgrade wouldn't restart
        # pods that already booted with the old env.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "scout.serviceAccountName" . }}
      {{- include "scout.imagePullSecrets" . | nindent 6 }}
      {{- include "scout.podSecurityContext" . | nindent 6 }}
      {{- if .Values.api.podAntiAffinityPreferred }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The API waits for the migrations Job before serving — Helm
      # orders the hook before the Deployment, but if migrations stall
      # the API pods would crashloop on the missing schema. The
      # initContainer below is a belt-and-braces pg_isready probe so
      # the API doesn't even try to start uvicorn until the DB is
      # reachable. The schema-presence check is implicit: if alembic
      # hasn't run, the API's first DB query errors and the readiness
      # probe fails — Kubernetes won't route traffic there.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres at $POSTGRES_HOST:$POSTGRES_PORT..."
                sleep 2
              done
              echo "postgres ready"
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ include "scout.fullname" . }}-config
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        - name: api
          image: {{ include "scout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "scout.containerSecurityContext" . | nindent 10 }}
          # Default container entrypoint from the Containerfile already
          # starts uvicorn on port 8000. The chart doesn't override
          # ``command:`` here so any tag-level entrypoint change keeps
          # working. If you need to start uvicorn with different flags,
          # override at the image tag, not in the chart.
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "scout.commonEnvFrom" . | nindent 10 }}
          env:
            - name: SCHEDULER_MODE
              value: {{ .Values.api.schedulerMode | quote }}
            {{- include "scout.commonSecretEnv" . | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: shared-storage
              mountPath: /var/lib/scout/storage
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{ include "scout.fullname" . }}-storage
