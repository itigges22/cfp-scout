{{- /*
ServiceMonitor for OpenShift user-workload-monitoring. Lets the
cluster's Prometheus stack discover the API's /metrics endpoint
without explicit kube_sd_config. Opt-in via monitoring.serviceMonitor.enabled.
Requires the cluster admin to have enabled user-workload monitoring
(``oc -n openshift-monitoring patch ... ``); the chart just provides
the resource.
*/}}
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "scout.fullname" . }}-api
  {{- if .Values.monitoring.serviceMonitor.namespace }}
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  {{- end }}
  labels:
    {{- include "scout.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "scout.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
