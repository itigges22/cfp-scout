{{- /*
``helm test`` runs this pod against the deployed API to confirm
basic connectivity. Useful as a smoke test after install. Hook
"test" means it doesn't run unless you call ``helm test scout``.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "scout.fullname" . }}-test-healthz
  labels:
    {{- include "scout.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          BASE="http://{{ include "scout.fullname" . }}-api:8000/api/v1"
          # /healthz is deliberately dependency-free — it returns 200 as
          # soon as uvicorn binds, so on its own it proves almost nothing
          # about a fresh install. /readyz exercises the Postgres
          # connection, which is what "did this deploy actually work?"
          # means. Check both so a failure says which layer broke.
          echo "GET $BASE/healthz (process alive)..."
          curl -fsS "$BASE/healthz"
          echo
          echo "GET $BASE/readyz (database reachable)..."
          curl -fsS "$BASE/readyz"
          echo
          echo "OK"
