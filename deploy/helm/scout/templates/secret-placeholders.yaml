{{- /*
Optional placeholder Secrets — rendered only when the operator opts in
via secrets.<name>.createPlaceholder=true. Most prod installs create
their secrets out-of-band (e.g. `oc create secret generic scout-llm
--from-literal=api-key=...`) so values never live in git. The chart
references the named Secret regardless of who created it.

These placeholders exist for first-day dev installs where you want
"helm install" to succeed even before secrets are populated.
*/}}
{{- if .Values.secrets.llm.createPlaceholder }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.llm.name }}
  labels:
    {{- include "scout.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.llm.apiKeyField }}: ""
  {{- if .Values.secrets.llm.embeddingApiKeyField }}
  {{ .Values.secrets.llm.embeddingApiKeyField }}: ""
  {{- end }}
{{- end }}
{{- if .Values.secrets.database.createPlaceholder }}
---
{{- /*
Random on first install, PRESERVED on upgrade. The previous version's
comment claimed randAlphaNum was "stable within a release" — it is not:
every `helm upgrade` re-renders the template and rolled both passwords,
while Postgres kept the ones it was initialized with, so the first
upgrade after install crash-looped every new pod on InvalidPasswordError.
The lookup reuses whatever the live Secret already holds.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.database.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.database.name }}
  labels:
    {{- include "scout.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Per-FIELD preservation: an operator-created Secret may hold only
  one of the two keys, and b64dec on a missing field is nil -> render
  error -> the whole upgrade fails. Missing fields get fresh randoms. */}}
  {{- if and $existing (hasKey $existing.data .Values.secrets.database.passwordField) }}
  {{ .Values.secrets.database.passwordField }}: {{ index $existing.data .Values.secrets.database.passwordField | b64dec | quote }}
  {{- else }}
  {{ .Values.secrets.database.passwordField }}: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data .Values.secrets.database.appPasswordField) }}
  {{ .Values.secrets.database.appPasswordField }}: {{ index $existing.data .Values.secrets.database.appPasswordField | b64dec | quote }}
  {{- else }}
  {{ .Values.secrets.database.appPasswordField }}: {{ randAlphaNum 32 | quote }}
  {{- end }}
{{- end }}
