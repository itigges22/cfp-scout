# Scout Helm values — defaults tuned for an internal team of ~100
# users on OpenShift. Override per-environment via:
#
#   helm upgrade --install scout deploy/helm/scout -f values-prod.yaml
#
# The chart deliberately runs two API replicas and a standalone
# scheduler by default, because:
#   - 2 API replicas survives a single pod restart without downtime.
#   - HPA scales 2..5 on CPU; well above the load 100 humans generate
#     in steady state, but cheap insurance.
#   - APScheduler isn't horizontally scalable, so the scheduler is its
#     own 1-replica Deployment with the API pods opting out via
#     SCHEDULER_MODE=disabled.
#
# Tighten resources downward for smaller teams; loosen for larger.

# ---------------------------------------------------------------------------
# Image — single image used by api / scheduler / migrations workloads,
# entrypoint overridden per workload.
# ---------------------------------------------------------------------------
image:
  repository: quay.io/your-org/scout-api
  tag: ""              # defaults to .Chart.appVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []      # add when pulling from a private registry, e.g. [{name: quay-pull-secret}]

# ---------------------------------------------------------------------------
# Naming + labels. ``nameOverride`` shortens the resource name prefix
# (default is the chart name "scout"); ``fullnameOverride`` replaces
# the full name template entirely.
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}

# ---------------------------------------------------------------------------
# API workload — FastAPI + bundled SPA. 100-user-sized.
# ---------------------------------------------------------------------------
api:
  replicas: 2
  # Drives the env var SCHEDULER_MODE on the API pods. With ``disabled``,
  # the API skips in-process scheduler init — required when there are
  # multiple replicas, otherwise each replica's scheduler competes for
  # the same job rows in the Postgres jobstore. Set to ``embedded`` only
  # for single-replica installs where you don't want a separate
  # scheduler Deployment.
  schedulerMode: disabled
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Liveness probe just needs to confirm uvicorn is alive — use the
  # SPA-served /health endpoint which is a static FastAPI 200 OK.
  livenessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 30
    periodSeconds: 30
  # Readiness needs DB connectivity + scheduler-jobstore reachability,
  # so use /api/v1/healthz which exercises the engine pool.
  readinessProbe:
    httpGet: { path: /api/v1/healthz, port: http }
    initialDelaySeconds: 10
    periodSeconds: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Optional: spread API replicas across nodes for HA. Disabled by
  # default to keep small clusters from getting stuck unschedulable.
  podAntiAffinityPreferred: false

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler for the API. Scales 2..5 on CPU; the
# 100-user load almost certainly never triggers a scale-up but the
# chart wires the spec so it's there when needed.
# ---------------------------------------------------------------------------
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Scheduler workload — runs ``python -m app.scheduler_standalone``.
# Hardcoded to 1 replica because APScheduler with multiple instances
# would race on the same jobstore rows. ``mode`` is the env var the
# process reads (not the api.schedulerMode above).
# ---------------------------------------------------------------------------
scheduler:
  enabled: true       # set to false if API uses schedulerMode=embedded
  mode: standalone    # SCHEDULER_MODE env var on the scheduler pod
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    exec:
      command: ["/bin/sh", "-c", "pgrep -f 'scheduler_standalone' > /dev/null"]
    initialDelaySeconds: 30
    periodSeconds: 60

# ---------------------------------------------------------------------------
# Postgres — vanilla StatefulSet with pgvector. Trade more sophisticated
# operators (CrunchyData) for portability; document the upgrade path
# in README.
# ---------------------------------------------------------------------------
postgres:
  image:
    repository: pgvector/pgvector
    tag: "pg15"
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations: []
  affinity: {}
  storage:
    size: 20Gi
    storageClass: ""    # empty → cluster default storage class
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Database name + user — override only if you have a naming policy.
  databaseName: scout
  username: scout

# ---------------------------------------------------------------------------
# Shared storage PVC mounted at /var/lib/scout/storage in both API
# and scheduler pods (raw_pages, uploaded PDFs).
#
# Access mode MUST be RWX when api.replicas > 1 OR scheduler.enabled is
# true (the scheduler needs to read scraper-fetched pages the API may
# have written). On OpenShift this typically requires an NFS-backed
# storage class — your cluster admin can tell you which storageClass
# offers RWX.
# ---------------------------------------------------------------------------
sharedStorage:
  size: 10Gi
  storageClass: ""    # MUST be RWX-capable
  accessMode: ReadWriteMany

# Alembic migrations run as the API Deployment's ``migrate`` init
# container (see api-deployment.yaml). This is the modern alternative
# to a pre-install Helm hook — every API replica's init container
# runs ``alembic upgrade head``, and Alembic's Postgres advisory lock
# serializes them so only one applies pending migrations. Eliminates
# the hook-ordering brittleness that hits when the migrations Job
# starts before the ConfigMap / ServiceAccount it depends on.

# ---------------------------------------------------------------------------
# OpenShift Route — external access for the API. TLS edge means the
# Route terminates TLS at the OpenShift router and forwards plain HTTP
# to the pod. Change to ``reencrypt`` if you have an internal cert
# inside the pod.
# ---------------------------------------------------------------------------
route:
  enabled: true
  # HAProxy request timeout for this route. Document-upload requests
  # (Docling parse + LLM extraction) routinely exceed the 30s default.
  timeout: 300s
  host: ""            # empty → auto-generated like scout-<ns>.<wildcard-domain>
  tls:
    enabled: true
    termination: edge   # edge | reencrypt | passthrough
    insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# Operator-tunable config. These map 1:1 to the env vars the API + scheduler
# read at startup. DB-side overrides at ``app.app_setting_overrides``
# still win at runtime — these are the BOOT defaults.
# ---------------------------------------------------------------------------
config:
  env: prod
  logLevel: INFO
  logFormat: json
  schedulerTimezone: UTC
  # MaaS / LLM endpoint configuration. The API key + (optional) embedding
  # key go in Secrets, not here. These are BOOT defaults — the runtime
  # source of truth is app.app_setting_overrides (managed in the
  # /settings/tunables UI) and changes there propagate to all pods
  # within SETTINGS_REFRESH_SECONDS without a redeploy.
  # Models must exist on the endpoint — /diagnostics has a live probe.
  llmBaseUrl: "https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com/v1"
  llmChatModel: "Qwen3.6-35B-A3B"
  llmEmbeddingModel: "Nomic-embed-text-v2-moe"
  llmEmbeddingBaseUrl: ""   # blank → reuses llmBaseUrl
  llmDryRun: "false"
  llmMonthlyBudgetUsd: "1000"
  llmMaxConcurrentCalls: "6"
  settingsRefreshSeconds: "30"
  scraperUserAgent: "Scout/1.0 (CFP Discovery)"
  scraperDefaultPolitenessSeconds: "3"
  # CORS origins — Route host gets auto-added if route.enabled and
  # route.host non-empty.
  corsOrigins: []

# ---------------------------------------------------------------------------
# Secrets.
#
# Defaults let `helm install` succeed on a clean cluster with no manual
# preparation. Nothing sensitive is committed here:
#
#   * database passwords are GENERATED (randAlphaNum 32) at install time
#   * the LLM key is created EMPTY on purpose — see below
#
# To manage them yourself instead, set createPlaceholder: false and create
# the named Secrets out of band:
#
#   oc create secret generic scout-db \
#     --from-literal=password=... --from-literal=app-password=...
# ---------------------------------------------------------------------------
secrets:
  llm:
    # Creates the Secret with an EMPTY api-key.
    #
    # The LLM key is not cluster configuration. It is registered in
    # settings_spec.py, so it is entered once through Settings after
    # deployment and stored as a database override — which means it can be
    # rotated by whoever operates the app, without a redeploy and without
    # anyone holding a kubeconfig.
    #
    # The app starts fine without it. Anything needing the model reports
    # "LLM is not configured" rather than crash-looping the pod.
    createPlaceholder: true
    name: scout-llm
    # Keys inside the Secret — env vars on the api/scheduler pods.
    apiKeyField: api-key
    embeddingApiKeyField: embedding-api-key  # optional; same value as api-key if not set
  database:
    # Generated at install time. Unlike the LLM key these CANNOT be entered
    # later — Postgres needs them before the app starts.
    createPlaceholder: true
    name: scout-db
    passwordField: password
    appPasswordField: app-password   # used by the API to log in as the app role

# ---------------------------------------------------------------------------
# Pod security. OpenShift's restricted-v2 SCC auto-injects the UID,
# GID, and fsGroup from each namespace's allocated range (typically
# 1000000000+ per namespace). Hardcoding fsGroup: 1001 in the chart
# would fail SCC admission with "1001 is not an allowed group" — so
# we DON'T set it. The chart only asserts non-root (which is always
# the case under restricted-v2) and the security baseline that every
# OpenShift-friendly app respects.
#
# If you're deploying somewhere with a custom SCC that demands a
# specific fsGroup, set it via --set podSecurityContext.fsGroup=<N>
# at install time — values here are deliberately minimal.
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false   # FastAPI needs writable tmp; postgres handles its own

serviceAccount:
  create: true
  name: ""        # blank → auto-generated like "scout"
  annotations: {}

# ---------------------------------------------------------------------------
# OpenShift oauth-proxy sidecar — gates all traffic behind Red Hat SSO.
# When enabled:
#   * A second container runs oauth-proxy on :8443 (HTTPS / reencrypt)
#   * The Service gains a port 8443 and a serving-cert annotation
#   * The Route switches to reencrypt termination targeting port oauth
#   * The ServiceAccount gets the OAuthRedirectReference annotation
#   * A session-cookie Secret and OCP CA-injection ConfigMap are created
#
# Disable for local dev (proxy not present; auth reads SCOUT_DEV_USER_EMAIL).
# ---------------------------------------------------------------------------
oauth:
  enabled: false       # set to true in OCP values override
  image: quay.io/openshift/origin-oauth-proxy:4.15
  emailDomain: redhat.com
  # Name of the Secret that holds the session cookie key.
  # Chart auto-creates it on first install (random 32-char value) and
  # leaves it unchanged on upgrades. Override via `oc set data` if needed.
  sessionSecretName: scout-proxy-session
  # Name of the TLS Secret auto-created by the service-ca operator when it
  # sees the service.beta.openshift.io/serving-cert-secret-name annotation.
  tlsSecretName: scout-api-tls
