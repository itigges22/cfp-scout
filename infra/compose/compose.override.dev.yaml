# Dev-only overrides for `make up-dev`.
#
# What's here:
#   - Postgres port exposed on the host (psql, pgAdmin, etc.)
#   - api source mounted for live reload via `uvicorn --reload`
#   - LOG_FORMAT=console for readable terminal output
#
# Apply with:  make up-dev
# Or:          docker compose -f compose.yaml -f compose.override.dev.yaml up
#
# Production-like checks (the default `make up`) do NOT include this file.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    # Live-reload: mount the app source over the image's copy.
    volumes:
      - ../../apps/api/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    environment:
      LOG_FORMAT: console
      LOG_LEVEL: DEBUG
