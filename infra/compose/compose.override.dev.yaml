# Dev-only overrides for `make up-dev`.
#
# What's here:
#   - Postgres port exposed on the host (psql, pgAdmin, etc.)
#   - api source mounted for live reload via `uvicorn --reload`
#   - LOG_FORMAT=console for readable terminal output
#
# Apply with:  make up-dev
# Or:          docker compose -f compose.yaml -f compose.override.dev.yaml up
#
# Production-like checks (the default `make up`) do NOT include this file.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    # Live-reload bind mounts. With these, the only time you need to
    # rebuild the image is when deps change in pyproject.toml or
    # package.json (or the Containerfile itself).
    #   - apps/api/app    → /app/app    (uvicorn --reload picks up edits in <1s)
    #   - apps/api/alembic → /app/alembic (new migrations visible to `make migrate`
    #                                       immediately)
    #   - apps/api/static → /app/static (`make spa` deposits fresh JS/CSS here;
    #                                     container serves it on the next request,
    #                                     no container rebuild needed)
    volumes:
      - ../../apps/api/app:/app/app
      - ../../apps/api/alembic:/app/alembic
      - ../../apps/api/static:/app/static
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    environment:
      LOG_FORMAT: console
      LOG_LEVEL: DEBUG
      # Force polling-based file watching. Bind-mount inotify events from
      # the macOS / Podman VM host don't propagate reliably through the
      # virtio-fs layer; uvicorn's underlying `watchfiles` library uses
      # inotify by default and silently misses changes. Polling adds
      # ~1s latency to reload detection but is reliable everywhere.
      WATCHFILES_FORCE_POLLING: "true"
